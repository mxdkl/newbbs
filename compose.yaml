services:
  newbbs:
    # Published by CI on every push to main. `podman-compose up -d` pulls it;
    # `--build` still builds from source locally and tags it the same.
    image: ghcr.io/mxdkl/newbbs:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: newbbs
    # The host key lives in the database, so losing this volume means every
    # client gets a host-key-changed warning on their next connection.
    volumes:
      - newbbs-data:/var/lib/newbbs
    # The board only ever accepts inbound ssh, so it binds the host's port
    # directly rather than depending on NAT. This works the same rootful or
    # rootless, and sidesteps compose wanting to build its own network --
    # which needs netavark and ip_tables, and collides with Docker's
    # FORWARD DROP policy if Docker is also installed.
    network_mode: host
    restart: unless-stopped

volumes:
  newbbs-data:
    # Pin the name: compose would otherwise prefix it with the project name and
    # quietly use a different volume than the plain `podman run` commands, so
    # switching between the two would look like the board had been wiped.
    name: newbbs-data
